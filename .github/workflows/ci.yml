name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
      - run: make test

  vet:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
      - run: make vet

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - name: Build Docker image (no push)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: kargo-loki-gateway:ci-build
          cache-from: type=gha,scope=gateway-image
          cache-to: type=gha,scope=gateway-image,mode=max,ignore-error=true
          provenance: false

  docs-freshness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
      - name: Check generated docs are up to date
        run: make docs-diff

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - run: make helm-lint

  e2e:
    runs-on: ubuntu-latest
    needs: [test, docker-build]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: src/go.mod
      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.24.0/kind-linux-amd64
          chmod +x ./kind && sudo mv ./kind /usr/local/bin/kind
      - name: Create kind cluster
        run: make kind-create
      - name: Build and load gateway image
        run: make kind-load KIND_CLUSTER=gateway-e2e
      - name: Pre-pull and load all e2e images into kind
        # Pulling on the Docker host (with layer cache) then loading into kind
        # is much faster than letting containerd pull inside the cluster.
        run: |
          IMAGES=(
            "quay.io/argoproj/argo-rollouts:v1.8.0"
            "grafana/loki:3.1.1"
            "grafana/alloy:v1.7.5"
            "busybox:1.36"
            "nginx:1.27-alpine"
          )
          for img in "${IMAGES[@]}"; do
            docker pull "$img"
            kind load docker-image "$img" --name gateway-e2e
          done
      - name: Deploy e2e infrastructure
        run: make e2e-infra
      - name: Run Chainsaw e2e tests
        run: make e2e
