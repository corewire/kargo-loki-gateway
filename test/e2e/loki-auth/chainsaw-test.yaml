# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: loki-auth
spec:
  description: |
    Verify that LOKI_USERNAME/LOKI_PASSWORD are forwarded to Loki.
    Uses a dedicated gateway instance so the shared gateway is never mutated,
    allowing this test to run safely in parallel with others.
  namespace: e2e-infra
  steps:
    - name: Deploy nginx basic-auth proxy and dedicated gateway
      try:
        - apply:
            file: loki-auth-proxy.yaml
        - apply:
            file: gateway-auth.yaml
        - script:
            timeout: 30s
            content: |
              kubectl -n e2e-infra wait --for=condition=available deployment/loki-auth-proxy --timeout=30s
              kubectl -n e2e-infra wait --for=condition=available deployment/kargo-loki-gateway-auth --timeout=30s

    - name: Proxy rejects unauthenticated requests
      try:
        - script:
            timeout: 20s
            content: |
              set -e
              kubectl -n e2e-infra port-forward svc/loki-auth-proxy 13200:3200 &
              PF=$!
              sleep 1
              trap "kill $PF 2>/dev/null" EXIT
              CODE=$(curl -so /dev/null -w '%{http_code}' http://localhost:13200/loki/api/v1/labels)
              [ "$CODE" = "401" ] || { echo "FAIL: expected 401 without auth, got $CODE"; exit 1; }
              echo "PASS: proxy returns 401 without credentials"

    - name: Proxy accepts valid basic auth
      try:
        - script:
            timeout: 20s
            content: |
              set -e
              kubectl -n e2e-infra port-forward svc/loki-auth-proxy 13201:3200 &
              PF=$!
              sleep 1
              trap "kill $PF 2>/dev/null" EXIT
              CODE=$(curl -so /dev/null -w '%{http_code}' -u e2e-user:e2e-pass http://localhost:13201/loki/api/v1/labels)
              [ "$CODE" = "200" ] || { echo "FAIL: expected 200 with auth, got $CODE"; exit 1; }
              echo "PASS: proxy accepts valid credentials"

    - name: Dedicated gateway retrieves logs via auth proxy
      try:
        - script:
            timeout: 20s
            content: |
              set -e
              kubectl -n e2e-infra port-forward svc/kargo-loki-gateway-auth 18083:80 &
              PF=$!
              sleep 1
              trap "kill $PF 2>/dev/null" EXIT
              BODY=$(curl -sf 'http://localhost:18083/logs?namespace=e2e-infra&container=e2e-logs')
              echo "$BODY" | grep -qv 'Failed to query Loki' || {
                echo "FAIL: gateway returned an error — auth may not be forwarded"
                echo "$BODY"
                exit 1
              }
              echo "PASS: gateway successfully queried Loki through basic-auth proxy"

    - name: Cleanup
      try:
        - delete:
            ref:
              apiVersion: apps/v1
              kind: Deployment
              name: kargo-loki-gateway-auth
        - delete:
            ref:
              apiVersion: v1
              kind: Service
              name: kargo-loki-gateway-auth
        - delete:
            ref:
              apiVersion: apps/v1
              kind: Deployment
              name: loki-auth-proxy
        - delete:
            ref:
              apiVersion: v1
              kind: Service
              name: loki-auth-proxy
        - delete:
            ref:
              apiVersion: v1
              kind: ConfigMap
              name: loki-auth-proxy-config
