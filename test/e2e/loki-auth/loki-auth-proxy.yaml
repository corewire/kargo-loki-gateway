---
# nginx that rejects requests missing Authorization: Basic ZTJlLXVzZXI6ZTJlLXBhc3M=
# (Base64 of "e2e-user:e2e-pass") — simpler than htpasswd, no dependency on apr1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-auth-proxy-config
  namespace: e2e-infra
data:
  nginx.conf: |
    events {}
    http {
      server {
        listen 3200;
        location / {
          if ($http_authorization != "Basic ZTJlLXVzZXI6ZTJlLXBhc3M=") {
            return 401;
          }
          proxy_pass http://loki.e2e-infra.svc.cluster.local:3100;
        }
      }
    }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: loki-auth-proxy
  namespace: e2e-infra
  labels:
    app: loki-auth-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: loki-auth-proxy
  template:
    metadata:
      labels:
        app: loki-auth-proxy
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports:
            - containerPort: 3200
          volumeMounts:
            - name: config
              mountPath: /etc/nginx/nginx.conf
              subPath: nginx.conf
          readinessProbe:
            tcpSocket:
              port: 3200
            initialDelaySeconds: 2
            periodSeconds: 3
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              memory: 32Mi
      volumes:
        - name: config
          configMap:
            name: loki-auth-proxy-config
---
apiVersion: v1
kind: Service
metadata:
  name: loki-auth-proxy
  namespace: e2e-infra
spec:
  selector:
    app: loki-auth-proxy
  ports:
    - port: 3200
      targetPort: 3200
