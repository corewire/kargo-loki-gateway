# yaml-language-server: $schema=https://raw.githubusercontent.com/kyverno/chainsaw/main/.schemas/json/test-chainsaw-v1alpha1.json
apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: gateway-validation
spec:
  description: |
    Verify that the gateway rejects invalid and missing parameters with 400.
  namespace: e2e-infra
  steps:
    - name: Validation returns 400 for bad input
      try:
        - script:
            timeout: 30s
            content: |
              set -e
              kubectl -n e2e-infra port-forward svc/kargo-loki-gateway 18081:80 >/dev/null 2>&1 &
              PF=$!
              trap 'kill "$PF" 2>/dev/null || true; wait "$PF" 2>/dev/null || true' EXIT
              sleep 1

              BODY=""
              deadline=$(( $(date +%s) + 30 ))
              while [ "$(date +%s)" -le "$deadline" ]; do
                BODY=$(curl -sf http://localhost:18081/healthz || true)
                if [ "$BODY" = "ok" ]; then
                  break
                fi
                echo "  waiting for gateway /healthz..."
                sleep 1
              done
              [ "$BODY" = "ok" ] || { echo "FAIL: gateway never became ready"; exit 1; }

              CODE=$(curl -so /dev/null -w '%{http_code}' http://localhost:18081/logs)
              [ "$CODE" = "400" ] || { echo "FAIL: missing namespace expected 400, got $CODE"; exit 1; }
              echo "PASS: missing namespace → $CODE"

              CODE=$(curl -so /dev/null -w '%{http_code}' 'http://localhost:18081/logs?namespace=demo%22%7D')
              [ "$CODE" = "400" ] || { echo "FAIL: injection expected 400, got $CODE"; exit 1; }
              echo "PASS: injection attempt → $CODE"
